name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Type check
        run: moon check

      - name: Run tests
        run: moon test --target js

      - name: Run CLI demo
        run: moon run src/cmd --target js -- 1.0.0-beta.2 1.0.0-beta.11
